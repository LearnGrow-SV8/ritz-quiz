# Supabase 免费项目保活
#
# 背景：免费计划的 Supabase 项目连续 7 天没有任何访问就会被自动暂停，
#       暂停后 <project>.supabase.co 的 DNS 记录会被摘掉（解析直接 NXDOMAIN），
#       于是页面上的题库同步、学员记录、跨设备登录密码全部失效，
#       学员只会看到一句含糊的「跨设备同步未成功」。
#
# 做法：每天定时向 PostgREST 发一个极轻量的查询（只取 0 行），
#       让项目始终有访问记录，永远不会因为"闲着"被暂停。
#       公开仓库的 GitHub Actions 不计费。
#
# 注意：cron 用 UTC。这里设为每天 03:00 UTC = 北京时间 11:00。
#       可在仓库 Actions 页手动点 Run workflow 立即验证。

name: Supabase keepalive

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
          # 直接写常量：anon key 本身就是公开的（已出现在 index.html 源码里），
          # 放进 Secrets 反而多一处要维护的地方。
      - name: Ping Supabase REST endpoint
        run: |
          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" \
            -H "apikey: sb_publishable_L0iHADNzbzl6GNia4npK0Q_djN_Rkes" \
            -H "Authorization: Bearer sb_publishable_L0iHADNzbzl6GNia4npK0Q_djN_Rkes" \
            "https://hkigwzzmvytpeudgkjik.supabase.co/rest/v1/accounts?select=phone&limit=1")
          echo "HTTP $code"
          head -c 200 /tmp/out.txt
          if [ "$code" != "200" ]; then
            echo "::error::Supabase ping failed with HTTP $code — project may be paused again"
            exit 1
          fi
